  <h2>About this project</h2>
  <p>Stagwell is a capstone insurance portal. Employers register, buy workers' compensation cover and raise claims. Surveyors verify them. Admins monitor employers, surveyors and payments.</p>
  <p>Built with Angular, ASP.NET Core microservices, SQL Server, JWT and an Ocelot gateway.</p>
